name: Build and Push to GHCR

on:
  push:
    branches: [ "production" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert owner to lowercase
        id: lowercase
        run: |
          echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.LOWER_OWNER }}/quizgen-backend:latest
            ghcr.io/${{ steps.lowercase.outputs.LOWER_OWNER }}/quizgen-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max